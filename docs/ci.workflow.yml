name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check sim/ plots/ tests/

      - name: Run unit & soundness tests (pytest)
        env:
          MPLBACKEND: Agg
        run: pytest -v

  posix-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile POSIX demo when present
        run: |
          if [ -f posix/pi_demo.c ]; then
            gcc -Wall -Wextra -Werror -O2 posix/pi_demo.c -o posix/pi_demo -lpthread -lrt
          else
            echo "posix/pi_demo.c not yet implemented; skipping compile check."
          fi
