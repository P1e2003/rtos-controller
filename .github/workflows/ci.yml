name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check sim/ plots/ tests/

      - name: Run unit & soundness tests (pytest)
        env:
          MPLBACKEND: Agg
        run: pytest -v

  posix-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and smoke-test POSIX demo
        run: |
          if [ -f posix/pi_demo.c ]; then
            make -C posix
            ./posix/pi_demo --help
            set +e
            bad_out=$(./posix/pi_demo --bogus 2>/dev/null)
            bad_rc=$?
            out=$(./posix/pi_demo --mode all --csv)
            rc=$?
            set -e
            test "$bad_rc" -eq 2
            test -z "$bad_out"
            if [ "$rc" -eq 77 ]; then
              test -z "$out"
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
            make -C posix clean
          else
            echo "posix/pi_demo.c not yet implemented; skipping compile check."
          fi
